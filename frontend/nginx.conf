server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to the backend Container App at runtime.
    # BACKEND_URL is injected from the container environment variable by the entrypoint.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required when upstream is HTTPS behind Azure Container Apps (Envoy
        # routes by SNI). Without these you get 502s.
        proxy_ssl_server_name on;
        proxy_ssl_name ${BACKEND_HOST};
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_connect_timeout 30s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
